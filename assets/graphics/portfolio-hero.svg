<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Eleftherios Kypraios — From Business to Technology</title>
  <desc id="desc">Dark portfolio banner introducing Eleftherios Kypraios and his focus on product ownership, software development, and quality assurance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#171435"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#8f7bff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect x="56" y="66" width="1088" height="208" rx="18" fill="#11172b" stroke="#283353" stroke-width="2"/>
  <rect x="56" y="66" width="10" height="208" fill="url(#accent)"/>

  <text x="94" y="119" fill="#e8efff" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    Eleftherios Kypraios
  </text>
  <text x="94" y="165" fill="#c2d4ff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="600">
    From Business to Technology
  </text>
  <text x="94" y="207" fill="#c2d4ff" font-size="20" font-family="Segoe UI, Arial, sans-serif">
    Product Ownership · Software Development · Quality Assurance
  </text>

  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.75">
    <path d="M820 102h280"/>
    <path d="M820 137h220"/>
    <path d="M820 172h255"/>
    <path d="M820 207h190"/>
    <path d="M820 242h235"/>
  </g>
</svg>

